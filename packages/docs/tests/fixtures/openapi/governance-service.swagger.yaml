  /health:
    get:
      consumes:
      - application/json
      description: Returns a static healthy response without checking dependencies,
        intended for orchestrator liveness probes
      produces:
      - application/json
      responses:
        "200":
          description: Health status
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Liveness probe
      tags:
      - Health
  /health/auth:
    get:
      consumes:
      - application/json
      description: Health check requiring a valid bearer token that confirms the end-to-end
        auth path by validating the token through the auth service and resolving the
        caller's user context
      produces:
      - application/json
      responses:
        "200":
          description: Auth integration verified
          schema:
            $ref: '#/definitions/handlers.HealthCheckAuthResponse'
        "401":
          description: Unauthorized - Invalid or expired token
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "503":
          description: Auth integration unavailable
          schema:
            $ref: '#/definitions/handlers.HealthCheckAuthResponse'
      security:
      - BearerAuth: []
      summary: Authenticated health check for the auth integration
      tags:
      - Health
  /health/ready:
    get:
      consumes:
      - application/json
      description: Reports whether the service can serve traffic by pinging the database,
        used by orchestrators to gate traffic
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            $ref: '#/definitions/handlers.HealthReadyResponse'
        "503":
          description: Service is not ready
          schema:
            $ref: '#/definitions/handlers.HealthReadyResponse'
      summary: Readiness probe
      tags:
      - Health
securityDefinitions:
  ApiKeyAuth:
    description: Type "Bearer" followed by a space and API key.
    in: header
    name: Authorization
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
