  /api/v1/rbac/check/permission/{permission}/project/{projectId}:
    get:
      consumes:
      - application/json
      description: Report whether the authenticated user holds the given permission
        within the specified project
      parameters:
      - description: Permission name
        in: path
        name: permission
        required: true
        type: string
      - description: Project ID, UUID (bare or urn:uuid), or slug:my-project within
          the caller's organization
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Permission check result; an unknown UUID or slug reports hasPermission
            false
          schema:
            $ref: '#/definitions/handlers.PermissionCheckResponse'
        "400":
          description: Project ID is not an integer, a UUID, or a slug
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized - Authentication required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Project or role lookup failed
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Check user permission in project
      tags:
      - RBAC
  /api/v1/rbac/metadata/permissions:
    get:
      consumes:
      - application/json
      description: Return metadata for every permission defined in the system, keyed
        by permission name
      produces:
      - application/json
      responses:
        "200":
          description: Permission metadata
          schema:
            $ref: '#/definitions/handlers.PermissionMetadataResponse'
        "401":
          description: Unauthorized - Authentication required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get permission metadata
      tags:
      - RBAC
  /api/v1/rbac/metadata/roles:
    get:
      consumes:
      - application/json
      description: Return metadata for every role defined in the system, keyed by
        role name
      produces:
      - application/json
      responses:
        "200":
          description: Role metadata keyed by role name
          schema:
            additionalProperties:
              $ref: '#/definitions/rbac.RoleMetadata'
            type: object
        "401":
          description: Unauthorized - Authentication required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get role metadata
      tags:
      - RBAC
  /api/v1/rbac/permission/{permission}/projects:
    get:
      consumes:
      - application/json
      description: Return every project in the caller's organization, or in every
        organization for a platform service account, where the authenticated principal
        holds the given permission, honoring API-key scopes and project binding. An
        empty list is a valid answer; like the check endpoints, an unknown permission
        is one nobody holds
      parameters:
      - description: Permission name
        in: path
        name: permission
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Projects where the permission holds
          schema:
            $ref: '#/definitions/handlers.PermissionProjectsResponse'
        "401":
          description: Unauthorized - Authentication required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Project or role lookup failed
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List projects where the user holds a permission
      tags:
      - RBAC
  /api/v1/rbac/user/permissions:
    get:
      consumes:
      - application/json
      description: Return the authenticated user's organization memberships, project
        assignments, and effective permissions in the governance-service contract
        format
      produces:
      - application/json
      responses:
        "200":
          description: User permissions and context
          schema:
            $ref: '#/definitions/handlers.GovernanceUserContext'
        "400":
          description: Could not determine a unique organization for this request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get user permissions for governance
      tags:
      - RBAC
  /api/v1/rbac/user/roles:
    get:
      consumes:
      - application/json
      description: Return the authenticated user's organization and project role assignments
        with derived scope
      produces:
      - application/json
      responses:
        "200":
          description: User roles with context
          schema:
            $ref: '#/definitions/handlers.UserRolesResponse'
        "401":
          description: Unauthorized - Authentication required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get current user's roles
      tags:
      - RBAC
  /api/v1/service-accounts/{serviceName}/token:
    get:
      consumes:
      - application/json
      description: Issue an access token for the named service account, authenticated
        via the shared API secret
      parameters:
      - description: Bearer {api_secret}
        in: header
        name: Authorization
        required: true
        type: string
      - description: Service account name
        in: path
        name: serviceName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Token response
          schema:
            $ref: '#/definitions/handlers.ServiceAccountTokenResponse'
        "400":
          description: Service name is required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized - Missing, malformed, or invalid API secret
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "403":
          description: Service account is not active
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Service account not found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error or API secret middleware misconfiguration
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Get service account access token
      tags:
      - Service Accounts
  /api/v1/service/did-keys/{keyId}:
    get:
      consumes:
      - application/json
      description: Retrieve DID key information for service-to-service calls (requires
        did:read scope)
      parameters:
      - description: Provider key ID (e.g., auth0-abc123) or the key's did:key
        in: path
        name: keyId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: DID key information
          schema:
            $ref: '#/definitions/core.DIDKeyInfo'
        "400":
          description: Bad request - Key ID required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized - API key authentication required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "403":
          description: Forbidden - Insufficient scope
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: DID key not found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get DID key for service
      tags:
      - Service API
  /api/v1/service/users/{userId}/did-keys:
    get:
      consumes:
      - application/json
      description: List all DID keys for a specific user (service endpoint, requires
        did:read scope)
      parameters:
      - description: Original IdP user ID exactly as issued (for example auth0|abc),
          or did:key. Normalized forms such as auth0-abc match nothing under OpenBao.
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of DID keys
          schema:
            $ref: '#/definitions/handlers.UserDIDKeyListResponse'
        "400":
          description: Bad request - User ID required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized - API key authentication required
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "403":
          description: Forbidden - Insufficient scope
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List user's DID keys for service
      tags:
      - Service API
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Return a paginated list of platform users, optionally filtered
        by active status; restricted to organization owners
      parameters:
      - description: 'Number of users to return (default: 100, max: 500)'
        in: query
        name: limit
        type: integer
      - description: Number of users to skip
        in: query
        name: offset
        type: integer
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            $ref: '#/definitions/handlers.ListUsersResponse'
        "400":
          description: Bad request - Invalid active filter
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "403":
          description: Forbidden - requires Organization Owner role
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List platform users
      tags:
      - Users
  /health:
    get:
      consumes:
      - application/json
      description: Returns a static healthy response without checking dependencies,
        intended for orchestrator liveness probes
      produces:
      - application/json
      responses:
        "200":
          description: Health status
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Liveness probe
      tags:
      - Health
  /health/auth:
    get:
      consumes:
      - application/json
      description: Health check requiring an API secret that confirms IDP reachability
        by fetching JWKS, so callers (IDP actions/webhooks) know the upstream provider
        is responsive before invoking other endpoints
      parameters:
      - description: Bearer {api_secret}
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Health status with IDP verified
          schema:
            $ref: '#/definitions/handlers.HealthCheckIDPResponse'
        "401":
          description: Unauthorized - Invalid API secret
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "503":
          description: IDP provider unreachable
          schema:
            $ref: '#/definitions/handlers.HealthCheckIDPResponse'
      summary: Authenticated health check for IDP actions
      tags:
      - Health
  /health/ready:
    get:
      consumes:
      - application/json
      description: Reports whether the service can serve traffic by pinging the database,
        used by orchestrators and the E2E preflight check
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            $ref: '#/definitions/handlers.HealthReadyResponse'
        "503":
          description: Service is not ready
          schema:
            $ref: '#/definitions/handlers.HealthReadyResponse'
      summary: Readiness check endpoint
      tags:
      - Health
  /health/signing:
    get:
      description: Checks OpenBao seal state, self capabilities, platform metadata
        and its committed association without signing. Independent of liveness and
        database readiness. Other providers report not_supported. Telemetry covers
        process-lifetime Transit sign attempts, excluding metadata resolution; latency_buckets
        are cumulative upper bounds.
      parameters:
      - description: Bearer {api_secret}
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SigningHealthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.SigningHealthResponse'
      summary: Signing backend health and telemetry
      tags:
      - Health
  /platform/api/v1/protected/did-doc:
    get:
      consumes:
      - application/json
      description: Return the DID document for the shared organization-key DID key;
        also mounted at /platform/api/v1/protected/did-doc for SDK AuthServiceSigner
        compatibility
      produces:
      - application/json
      responses:
        "200":
          description: DID Document
          schema:
            $ref: '#/definitions/core.DIDDocument'
        "401":
          description: Unauthorized - Invalid or missing credential
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get platform DID document
      tags:
      - DID Keys
  /platform/api/v1/protected/sign:
    post:
      consumes:
      - application/json
      description: Sign a 32-byte SHA-256 digest (hex-encoded) using the shared organization-key
        DID key; also mounted at /platform/api/v1/protected/sign for SDK AuthServiceSigner
        compatibility
      parameters:
      - description: Hex encoded data hash to sign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Signature created successfully
          schema:
            $ref: '#/definitions/handlers.SignResponse'
        "400":
          description: Bad request - Invalid data
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "403":
          description: Forbidden - requires Audit Owner, Organization Owner, or Project
            Owner role
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Bound platform key missing or disabled
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "409":
          description: Bound reference mismatch
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "503":
          description: Version-bound signing unavailable
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Sign a digest with the platform DID key
      tags:
      - DID Keys
  /platform/api/v1/protected/signing-key:
    get:
      description: Echo the reference on the matching platform sign route; authorization
        matches platform signing.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/core.SigningKeyInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get version-bound signing metadata for the shared platform key
      tags:
      - DID Keys
securityDefinitions:
  ApiKeyAuth:
    description: Type "Bearer" followed by a space and API key
    in: header
    name: Authorization
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
